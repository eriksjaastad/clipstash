[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipstash-helper"
version = "0.1.0"
description = "Local helper for clipstash: writes video-still packets and serves the Chrome extension."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
clipstashd = "helper.cli:main"

[tool.setuptools.packages.find]
include = ["helper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
