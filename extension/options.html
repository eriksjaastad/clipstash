  <body>
    <h1>clipstash options</h1>
    <p>
      The packet save root is configured on the helper side for v1, not here.
      Start the helper with a custom root:
    </p>
    <pre>clipstashd --root /path/to/packets</pre>
    <p>or set <code>CLIPSTASH_ROOT</code> before launching.</p>
    <p>Default: <code>~/Clipstash/packets</code></p>
    <script src="options.js"></script>
  </body>
