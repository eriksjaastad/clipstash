<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Without clipstash vs with clipstash</title>
  <desc id="desc">Nine manual steps versus open URL, hotkey, create banner, and export. Create banner is the same either way.</desc>
  <rect width="960" height="520" fill="#0f1419"/>
  <text x="480" y="32" text-anchor="middle" fill="#e7ecf1" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700">What the hotkey removes</text>
  <text x="480" y="52" text-anchor="middle" fill="#8b9aab" font-family="Helvetica, Arial, sans-serif" font-size="12">Create banner (−) is the same either way. Everything else in the left column is filing and bookkeeping.</text>
  <rect x="28" y="72" width="440" height="420" rx="12" fill="#1a222c" stroke="#3d4a58"/>
  <text x="248" y="100" text-anchor="middle" fill="#ff8a7a" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Without the tool</text>
  <text x="48" y="132" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">1. Find the video</text>
  <text x="48" y="158" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">2. Take a screenshot</text>
  <text x="48" y="184" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">3. Find where the screenshot was saved</text>
  <text x="48" y="210" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">4. Drag the file into Photoshop</text>
  <text x="48" y="236" fill="#8b9aab" font-family="Helvetica, Arial, sans-serif" font-size="13">5. Create banner (−)</text>
  <text x="48" y="262" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">6. Export</text>
  <text x="48" y="288" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">7. Type the name when you save</text>
  <text x="48" y="314" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">8. Paste the image name into Excel</text>
  <text x="48" y="340" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">9. Copy the video URL into Excel</text>
  <text x="48" y="390" fill="#8b9aab" font-family="Helvetica, Arial, sans-serif" font-size="12">Repeat for every video across sites.</text>
  <text x="48" y="450" fill="#ff8a7a" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">You own every filing step.</text>
  <rect x="492" y="72" width="440" height="420" rx="12" fill="#12261c" stroke="#2f6b4f"/>
  <text x="712" y="100" text-anchor="middle" fill="#6dcea0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">With clipstash</text>
  <text x="512" y="150" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">1. Open the video URL</text>
  <text x="512" y="176" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">2. Hotkey (save, organize, log, place)</text>
  <text x="512" y="202" fill="#8b9aab" font-family="Helvetica, Arial, sans-serif" font-size="13">3. Create banner (−)</text>
  <text x="512" y="228" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">4. Export</text>
  <text x="512" y="290" fill="#8b9aab" font-family="Helvetica, Arial, sans-serif" font-size="12">Still, title, and URL are already in the packet.</text>
  <text x="512" y="314" fill="#8b9aab" font-family="Helvetica, Arial, sans-serif" font-size="12">Burst frames are optional when the pause is hard.</text>
  <text x="512" y="450" fill="#6dcea0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Filing and the spreadsheet row are done for you.</text>
</svg>
