<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Stick figures: hotkey vs paperwork</title>
  <desc id="desc">Top: one stick figure pushes a MAKE button. Bottom: another stick figure writes at a desk over and over for the manual steps.</desc>
  <rect width="1100" height="520" fill="#ffffff"/>

  <!-- Top label -->
  <text x="24" y="36" fill="#111" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700">With clipstash</text>

  <!-- Top panel 1: standing -->
  <rect x="24" y="48" width="200" height="160" fill="none" stroke="#111" stroke-width="2"/>
  <!-- stick standing -->
  <circle cx="124" cy="88" r="14" fill="none" stroke="#111" stroke-width="2.5"/>
  <line x1="124" y1="102" x2="124" y2="150" stroke="#111" stroke-width="2.5"/>
  <line x1="124" y1="118" x2="100" y2="140" stroke="#111" stroke-width="2.5"/>
  <line x1="124" y1="118" x2="148" y2="140" stroke="#111" stroke-width="2.5"/>
  <line x1="124" y1="150" x2="106" y2="185" stroke="#111" stroke-width="2.5"/>
  <line x1="124" y1="150" x2="142" y2="185" stroke="#111" stroke-width="2.5"/>
  <text x="124" y="198" text-anchor="middle" fill="#111" font-family="Helvetica, Arial, sans-serif" font-size="12">ready</text>

  <!-- arrow -->
  <line x1="240" y1="120" x2="300" y2="120" stroke="#111" stroke-width="2.5"/>
  <polygon points="300,112 318,120 300,128" fill="#111"/>

  <!-- Top panel 2: push MAKE -->
  <rect x="340" y="48" width="320" height="160" fill="none" stroke="#111" stroke-width="2"/>
  <!-- wall button -->
  <rect x="500" y="70" width="130" height="100" rx="8" fill="none" stroke="#111" stroke-width="2.5"/>
  <rect x="520" y="95" width="90" height="50" rx="6" fill="#111"/>
  <text x="565" y="126" text-anchor="middle" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700">MAKE</text>
  <!-- stick pushing -->
  <circle cx="420" cy="95" r="14" fill="none" stroke="#111" stroke-width="2.5"/>
  <line x1="420" y1="109" x2="420" y2="155" stroke="#111" stroke-width="2.5"/>
  <line x1="420" y1="125" x2="400" y2="145" stroke="#111" stroke-width="2.5"/>
  <line x1="420" y1="125" x2="500" y2="120" stroke="#111" stroke-width="2.5"/>
  <line x1="420" y1="155" x2="402" y2="190" stroke="#111" stroke-width="2.5"/>
  <line x1="420" y1="155" x2="438" y2="190" stroke="#111" stroke-width="2.5"/>
  <text x="500" y="198" text-anchor="middle" fill="#111" font-family="Helvetica, Arial, sans-serif" font-size="12">hotkey — paperwork done</text>

  <!-- Bottom label -->
  <text x="24" y="250" fill="#111" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Without the tool</text>

  <!-- helper: desk writer panel macro via repeated geometry -->
  <!-- panel A: write -->
  <rect x="24" y="262" width="180" height="220" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="70" cy="300" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="70" y1="312" x2="70" y2="350" stroke="#111" stroke-width="2"/>
  <line x1="70" y1="325" x2="55" y2="345" stroke="#111" stroke-width="2"/>
  <line x1="70" y1="325" x2="100" y2="340" stroke="#111" stroke-width="2"/>
  <line x1="70" y1="350" x2="58" y2="385" stroke="#111" stroke-width="2"/>
  <line x1="70" y1="350" x2="85" y2="385" stroke="#111" stroke-width="2"/>
  <rect x="95" y="350" width="90" height="12" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="105" y1="356" x2="145" y2="356" stroke="#111" stroke-width="1.5"/>
  <line x1="105" y1="360" x2="160" y2="360" stroke="#111" stroke-width="1.5"/>
  <text x="114" y="460" text-anchor="middle" fill="#111" font-family="Helvetica, Arial, sans-serif" font-size="11">write it down</text>

  <line x1="214" y1="370" x2="240" y2="370" stroke="#111" stroke-width="2"/>
  <polygon points="240,364 252,370 240,376" fill="#111"/>

  <!-- panel B: screenshot -->
  <rect x="260" y="262" width="180" height="220" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="300" y="300" width="70" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="335" y1="350" x2="335" y2="365" stroke="#111" stroke-width="2"/>
  <line x1="320" y1="365" x2="350" y2="365" stroke="#111" stroke-width="2"/>
  <circle cx="400" cy="320" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="400" y1="332" x2="400" y2="370" stroke="#111" stroke-width="2"/>
  <line x1="400" y1="345" x2="370" y2="335" stroke="#111" stroke-width="2"/>
  <line x1="400" y1="345" x2="420" y2="360" stroke="#111" stroke-width="2"/>
  <line x1="400" y1="370" x2="388" y2="405" stroke="#111" stroke-width="2"/>
  <line x1="400" y1="370" x2="415" y2="405" stroke="#111" stroke-width="2"/>
  <text x="350" y="460" text-anchor="middle" fill="#111" font-family="Helvetica, Arial, sans-serif" font-size="11">screenshot</text>

  <line x1="450" y1="370" x2="476" y2="370" stroke="#111" stroke-width="2"/>
  <polygon points="476,364 488,370 476,376" fill="#111"/>

  <!-- panel C: drag file -->
  <rect x="496" y="262" width="180" height="220" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="520" y="310" width="40" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="540" y="340" text-anchor="middle" fill="#111" font-family="Helvetica, Arial, sans-serif" font-size="10">file</text>
  <circle cx="620" cy="320" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="620" y1="332" x2="620" y2="370" stroke="#111" stroke-width="2"/>
  <line x1="620" y1="345" x2="560" y2="335" stroke="#111" stroke-width="2"/>
  <line x1="620" y1="345" x2="640" y2="360" stroke="#111" stroke-width="2"/>
  <line x1="620" y1="370" x2="608" y2="405" stroke="#111" stroke-width="2"/>
  <line x1="620" y1="370" x2="635" y2="405" stroke="#111" stroke-width="2"/>
  <text x="586" y="460" text-anchor="middle" fill="#111" font-family="Helvetica, Arial, sans-serif" font-size="11">drag into PS</text>

  <line x1="686" y1="370" x2="712" y2="370" stroke="#111" stroke-width="2"/>
  <polygon points="712,364 724,370 712,376" fill="#111"/>

  <!-- panel D: write again -->
  <rect x="732" y="262" width="160" height="220" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="770" cy="300" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="770" y1="312" x2="770" y2="350" stroke="#111" stroke-width="2"/>
  <line x1="770" y1="325" x2="755" y2="345" stroke="#111" stroke-width="2"/>
  <line x1="770" y1="325" x2="800" y2="340" stroke="#111" stroke-width="2"/>
  <line x1="770" y1="350" x2="758" y2="385" stroke="#111" stroke-width="2"/>
  <line x1="770" y1="350" x2="785" y2="385" stroke="#111" stroke-width="2"/>
  <rect x="790" y="350" width="80" height="12" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="798" y1="356" x2="850" y2="356" stroke="#111" stroke-width="1.5"/>
  <text x="812" y="460" text-anchor="middle" fill="#111" font-family="Helvetica, Arial, sans-serif" font-size="11">name it</text>

  <line x1="902" y1="370" x2="922" y2="370" stroke="#111" stroke-width="2"/>
  <polygon points="922,364 934,370 922,376" fill="#111"/>

  <!-- panel E: write Excel -->
  <rect x="942" y="262" width="140" height="220" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="975" cy="300" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="975" y1="312" x2="975" y2="350" stroke="#111" stroke-width="2"/>
  <line x1="975" y1="325" x2="960" y2="345" stroke="#111" stroke-width="2"/>
  <line x1="975" y1="325" x2="1005" y2="340" stroke="#111" stroke-width="2"/>
  <line x1="975" y1="350" x2="963" y2="385" stroke="#111" stroke-width="2"/>
  <line x1="975" y1="350" x2="990" y2="385" stroke="#111" stroke-width="2"/>
  <rect x="990" y="348" width="70" height="14" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="996" y1="353" x2="1045" y2="353" stroke="#111" stroke-width="1"/>
  <line x1="996" y1="357" x2="1040" y2="357" stroke="#111" stroke-width="1"/>
  <line x1="996" y1="361" x2="1048" y2="361" stroke="#111" stroke-width="1"/>
  <text x="1012" y="460" text-anchor="middle" fill="#111" font-family="Helvetica, Arial, sans-serif" font-size="11">Excel again</text>
</svg>
