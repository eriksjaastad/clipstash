<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Manual banner workflow vs clipstash</title>
  <desc id="desc">Side-by-side comparison: many slow manual steps versus fewer capture and packet steps. Savings grow with volume.</desc>
  <rect width="960" height="420" fill="#0f1419"/>
  <text x="480" y="36" text-anchor="middle" fill="#e7ecf1" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Where the time goes — making ~100 creator banners</text>
  <text x="480" y="58" text-anchor="middle" fill="#8b9aab" font-family="Helvetica, Arial, sans-serif" font-size="12">Savings grow with volume. At 5 banners it helps; at 100 it compounds.</text>

  <!-- Left: manual -->
  <rect x="40" y="80" width="420" height="300" rx="12" fill="#1a222c" stroke="#3d4a58"/>
  <text x="250" y="110" text-anchor="middle" fill="#ff8a7a" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Without clipstash</text>
  <text x="60" y="142" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">1. Open video · scrub · screenshot</text>
  <text x="60" y="168" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">2. Save file · rename somehow</text>
  <text x="60" y="194" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">3. Open Photoshop · place · name layer</text>
  <text x="60" y="220" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">4. Mask / template · export</text>
  <text x="60" y="246" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">5. Hunt the URL when you need a remake</text>
  <text x="60" y="272" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">6. Keep your own spreadsheet / notes</text>
  <text x="60" y="310" fill="#8b9aab" font-family="Helvetica, Arial, sans-serif" font-size="12">Repeat × 100 across YT / TikTok / IG / X</text>
  <text x="60" y="340" fill="#ff8a7a" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Cost: context switches + lost links + naming drift</text>

  <!-- Right: clipstash -->
  <rect x="500" y="80" width="420" height="300" rx="12" fill="#12261c" stroke="#2f6b4f"/>
  <text x="710" y="110" text-anchor="middle" fill="#6dcea0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">With clipstash</text>
  <text x="520" y="142" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">1. Hotkey on the video page</text>
  <text x="520" y="168" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">2. Pick the frame from a short burst</text>
  <text x="520" y="194" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">3. Packet written: still + title + URL (YAML)</text>
  <text x="520" y="220" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">4. Optional: place into Photoshop as a layer</text>
  <text x="520" y="246" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">5. Finish mask / export in your template</text>
  <text x="520" y="272" fill="#c5d0db" font-family="Helvetica, Arial, sans-serif" font-size="13">6. Log is already CSV-exportable</text>
  <text x="520" y="310" fill="#8b9aab" font-family="Helvetica, Arial, sans-serif" font-size="12">Same loop · four sites · link always in the packet</text>
  <text x="520" y="340" fill="#6dcea0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Savings: capture + naming + provenance at scale</text>
</svg>
